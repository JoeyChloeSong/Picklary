name: Optional real browser export and engine package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Package pinned FFmpeg core
        run: npm run engine:cache
      - run: npm run check
      - run: python -m pip install playwright==1.51.1
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test actual browser output
        run: python scripts/browser-export-smoke.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: picklary-engine-packaged-netlify
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-browser-export-report
          path: test-results/browser-export/
