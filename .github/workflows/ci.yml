name: Validate and build Picklary
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Export deploy-ready files
        uses: actions/upload-artifact@v4
        with:
          name: picklary-netlify-dist
          path: dist/
          if-no-files-found: error
      - name: Export test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picklary-audit
          path: test-results/*.json
          if-no-files-found: warn
